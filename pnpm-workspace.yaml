allowBuilds:
  sharp: false
  unrs-resolver: false

# Nextra 4.6.1 validates a destructured Layout with a required children field.
# Zod >=4.4 rejects it: https://github.com/shuding/nextra/issues/4989
# Keep the compatibility pin scoped to Nextra until its upstream fix ships.
overrides:
  'nextra@4.6.1>zod': 4.3.6
  'nextra-theme-docs@4.6.1>zod': 4.3.6
